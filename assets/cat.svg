<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-label="Animated detective cat with a magnifying glass" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <style>
    /* ============================================================
       1. PALETTE  (change a colour here and it updates everywhere)
       ============================================================ */
    :root {
      --navy:   #101c2f;   /* background, belt, pupils */
      --blue:   #62aaff;   /* eyes, outlines, highlights */
      --white:  #F7F9F7;   /* hat, collar */
      --orange: #FF7036;   /* coat, nose, mouth, whiskers */
      --ice:    #cfe6ff;   /* magnifier */
      --mist:   #bcd3f5;   /* grid lines, frame */
      --fur:    #121212;   /* cat body */
      --skin:   #D8A978;   /* cat face */
    }

    /* ============================================================
       2. CAT PARTS  (which palette colour each part uses)
       ============================================================ */
    .tail-outline { fill: none; stroke: var(--blue); stroke-opacity: .6; stroke-width: 9; stroke-linecap: round; }
    .tail-fill    { fill: none; stroke: var(--fur);  stroke-width: 6.5; stroke-linecap: round; }

    .body     { fill: var(--fur); stroke: var(--blue); stroke-opacity: .6; stroke-width: 1.2; }
    .coat     { fill: var(--orange); }
    .belt     { fill: none; stroke: var(--navy); stroke-width: 3.2; }
    .buckle   { fill: var(--white); }

    .face     { fill: var(--skin); }
    .collar   { fill: var(--white); }
    .iris     { fill: var(--blue); }
    .pupil    { fill: var(--navy); }
    .glint    { fill: #fff; }
    .nose     { fill: var(--orange); }
    .mouth    { fill: none; stroke: var(--orange); stroke-width: 1.8; stroke-linecap: round; }
    .whiskers { fill: none; stroke: var(--orange); stroke-width: 1.1; stroke-linecap: round; }

    .hat-shade { fill: var(--ice); }
    .hat       { fill: var(--white); }
    .hat-band  { fill: var(--orange); }

    .lens-handle { stroke: var(--ice); stroke-width: 4; stroke-linecap: round; }
    .lens-glass  { fill: var(--blue); fill-opacity: .14; stroke: var(--ice); stroke-width: 3; }
    .lens-shine  { fill: none; stroke: #fff; stroke-opacity: .7; stroke-width: 2; stroke-linecap: round; }
    .paw         { fill: var(--fur); stroke: var(--blue); stroke-opacity: .6; stroke-width: 1.2; }

    /* ============================================================
       3. OTHER ELEMENTS
       ============================================================ */
    .mono       { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .chip-text  { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .chip-bug   { fill: var(--orange); fill-opacity: .15; stroke: var(--orange); stroke-opacity: .7; stroke-width: 2; }
    .chip-found { fill: var(--blue);   fill-opacity: .12; stroke: var(--blue);   stroke-opacity: .7; stroke-width: 2; }
    .terminal   { font-size: 20px; fill: var(--ice); }

    /* ============================================================
       4. ANIMATIONS  (change the seconds to speed up / slow down)
       ============================================================ */
    @keyframes bob    { 0%, 100% { transform: translateY(0); }  50% { transform: translateY(-2px); } }
    @keyframes blink  { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes look   { 0%, 40%, 100% { transform: translateX(0); } 50%, 80% { transform: translateX(2.5px); } }
    @keyframes tail   { 0%, 100% { transform: rotate(0); }      50% { transform: rotate(14deg); } }
    @keyframes lens   { 0%, 100% { transform: rotate(-8deg); }  50% { transform: rotate(10deg); } }
    @keyframes float  { 0%, 100% { transform: translateY(0); }  50% { transform: translateY(-14px); } }
    @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .5; } 50% { transform: scaleX(.85); opacity: .3; } }
    @keyframes cursor { 50% { opacity: 0; } }

    .cat-body { animation: bob 2.6s ease-in-out infinite; }
    .eyes     { animation: look 6s ease-in-out infinite; }
    .pupil    { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.2s infinite; }
    .tail     { transform-origin: 12px 90px; animation: tail 1.8s ease-in-out infinite; }
    .lens     { transform-origin: 84px 94px; animation: lens 2.4s ease-in-out infinite; }
    .float-a  { animation: float 4s ease-in-out infinite; }
    .float-b  { animation: float 5s ease-in-out 1s infinite; }
    .shadow   { transform-box: fill-box; transform-origin: 50% 50%; animation: shadow 2.6s ease-in-out infinite; }
    .cursor   { animation: cursor 1s step-end infinite; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#62aaff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#62aaff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#bcd3f5" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="frame"><rect width="720" height="720" rx="40"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- ===== BACKGROUND ===== -->
    <rect width="720" height="720" fill="#101c2f"/>
    <rect width="720" height="720" fill="url(#grid)"/>
    <circle cx="360" cy="330" r="300" fill="url(#halo)"/>

    <!-- ===== FLOATING CHIPS ===== -->
    <g class="float-a" transform="translate(110 140)">
      <rect class="chip-bug" x="-62" y="-24" width="124" height="48" rx="24"/>
      <text class="mono chip-text" x="0" y="7" fill="#FF7036">BUG-001</text>
    </g>
    <g class="float-b" transform="translate(612 160)">
      <rect class="chip-found" x="-56" y="-24" width="112" height="48" rx="24"/>
      <text class="mono chip-text" x="0" y="7" fill="#62aaff">FOUND</text>
    </g>

    <!-- ===== SHADOW ===== -->
    <ellipse class="shadow" cx="360" cy="640" rx="150" ry="14" fill="#000"/>

    <!-- ============================================================
         THE CAT  (drawn at 88 x 115 units, then scaled up 4.6x)
         Move him:  translate(x y)     Resize him:  scale(n)
         ============================================================ -->
    <g transform="translate(157 95) scale(4.6)">
      <g class="cat-body">

        <!-- tail (behind the body) -->
        <g class="tail">
          <path class="tail-outline" d="M12 90 q-26 0 -21 -30"/>
          <path class="tail-fill"    d="M12 90 q-26 0 -21 -30"/>
        </g>

        <!-- body + ears -->
        <path class="body" d="M10 32 L14 6 Q15 2 19 4 L33 15 Q44 12 55 15
                              L69 4 Q73 2 74 6 L78 32 Q84 46 81 62
                              Q78 92 44 98 Q10 92 7 62 Q4 46 10 32 Z"/>

        <!-- trench coat -->
        <path class="coat"   d="M13 76 Q44 90 75 76 L82 106 Q44 116 6 106 Z"/>
        <path class="belt"   d="M9 98 Q44 108 79 98"/>
        <rect class="buckle" x="41" y="100" width="6" height="5" rx="1.5"/>

        <!-- face -->
        <path class="face" d="M16 50 Q16 35 31 35 Q44 38 57 35 Q72 35 72 50
                              Q72 77 44 78 Q16 77 16 50 Z"/>

        <!-- collar -->
        <path class="collar" d="M28 79 L40 94 L44 82 Z M60 79 L48 94 L44 82 Z"/>

        <!-- eyes -->
        <ellipse class="iris" cx="32" cy="54" rx="7.5" ry="9.5"/>
        <ellipse class="iris" cx="56" cy="54" rx="7.5" ry="9.5"/>
        <g class="eyes">
          <ellipse class="pupil" cx="33" cy="55" rx="3.6" ry="4.8"/>
          <ellipse class="pupil" cx="57" cy="55" rx="3.6" ry="4.8"/>
        </g>
        <circle class="glint" cx="34" cy="52" r="1.4"/>
        <circle class="glint" cx="58" cy="52" r="1.4"/>

        <!-- nose, mouth, whiskers -->
        <ellipse class="nose" cx="44" cy="64" rx="3" ry="2"/>
        <path class="mouth" d="M40 68 Q44 71 48 68"/>
        <path class="whiskers" d="M24 66 L10 63  M24 70 L11 73  M64 66 L78 63  M64 70 L77 73"/>

        <!-- detective hat -->
        <ellipse class="hat-shade" cx="44" cy="30"   rx="28" ry="5.5"/>
        <ellipse class="hat"       cx="44" cy="27.5" rx="28" ry="5.5"/>
        <path    class="hat"       d="M31 27 Q30 8 44 8 Q58 8 57 27 Z"/>
        <path    class="hat-band"  d="M31 22.5 Q44 27 57 22.5 L57.2 27 Q44 31 30.8 27 Z"/>

        <!-- magnifying glass -->
        <g class="lens">
          <line   class="lens-handle" x1="90" y1="98" x2="101" y2="109"/>
          <circle class="lens-glass"  cx="82" cy="90" r="11"/>
          <path   class="lens-shine"  d="M75 86 q3 -5 8 -5"/>
          <ellipse class="paw"        cx="88" cy="99" rx="5" ry="4"/>
        </g>

      </g>
    </g>

    <!-- ===== TERMINAL LINE ===== -->
    <text class="mono terminal" x="60" y="690">
      <tspan fill="#62aaff">$</tspan> ./detective --find-bugs<tspan class="cursor" fill="#FF7036"> &#9613;</tspan>
    </text>

    <!-- ===== FRAME BORDER ===== -->
    <rect x="1" y="1" width="718" height="718" rx="40" fill="none" stroke="#bcd3f5" stroke-opacity=".12" stroke-width="2"/>
  </g>
</svg>
