<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-label="Bug life cycle: the detective cat is at the Retest stage">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes halo { 0%,100% { opacity: .35; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes core { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @keyframes flowdone { to { stroke-dashoffset: -30; } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .5; } 50% { transform: scaleX(.85); opacity: .3; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes look { 0%,40%,100% { transform: translateX(0); } 50%,80% { transform: translateX(2.5px); } }
    @keyframes tail { 0%,100% { transform: rotate(0); } 50% { transform: rotate(14deg); } }
    @keyframes lens { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
    @keyframes bar { from { transform: scaleX(0); } }
    @keyframes sweep { from { transform: translateX(-300px); } to { transform: translateX(1700px); } }
    @keyframes dots { 0%,20% { opacity: 0; } 40%,100% { opacity: 1; } }
    @keyframes cur { 50% { opacity: 0; } }
    @keyframes packet { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(var(--span)); opacity: 0; } }

    .halo { transform-box: fill-box; transform-origin: 50% 50%; animation: halo 2.2s ease-in-out infinite; }
    .spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 4s linear infinite; }
    .core { animation: core 1s ease-in-out infinite; }
    .ahead { stroke-dasharray: 2 16; animation: flow 1.6s linear infinite; }
    .done-flow { stroke-dasharray: 2 14; animation: flowdone 1.6s linear infinite; }
    .packet { animation: packet 3.4s ease-in-out infinite; }
    .shadow { transform-box: fill-box; transform-origin: 50% 50%; animation: shadow 2.6s ease-in-out infinite; }
    .bar { transform-box: fill-box; transform-origin: 0 50%; animation: bar 1.6s cubic-bezier(.2,.7,.2,1) both; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    .d1 { animation: dots 1.2s infinite; } .d2 { animation: dots 1.2s .2s infinite; } .d3 { animation: dots 1.2s .4s infinite; }
    .cur { animation: cur 1s step-end infinite; }

    /* detective cat */
    .k-tail-outline { fill: none; stroke: #62aaff; stroke-opacity: .6; stroke-width: 9; stroke-linecap: round; }
    .k-tail-fill { fill: none; stroke: #121212; stroke-width: 6.5; stroke-linecap: round; }
    .k-body { fill: #121212; stroke: #62aaff; stroke-opacity: .6; stroke-width: 1.2; }
    .k-coat { fill: #FF7036; }
    .k-belt { fill: none; stroke: #101c2f; stroke-width: 3.2; }
    .k-buckle { fill: #F7F9F7; }
    .k-face { fill: #D8A978; }
    .k-collar { fill: #F7F9F7; }
    .k-iris { fill: #62aaff; }
    .k-pupil { fill: #101c2f; transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.2s infinite; }
    .k-glint { fill: #fff; }
    .k-nose { fill: #FF7036; }
    .k-mouth { fill: none; stroke: #FF7036; stroke-width: 1.8; stroke-linecap: round; }
    .k-whiskers { fill: none; stroke: #FF7036; stroke-width: 1.1; stroke-linecap: round; }
    .k-hat-shade { fill: #cfe6ff; }
    .k-hat { fill: #F7F9F7; }
    .k-hat-band { fill: #FF7036; }
    .k-lens-handle { stroke: #cfe6ff; stroke-width: 4; stroke-linecap: round; }
    .k-lens-glass { fill: #62aaff; fill-opacity: .14; stroke: #cfe6ff; stroke-width: 3; }
    .k-lens-shine { fill: none; stroke: #fff; stroke-opacity: .7; stroke-width: 2; stroke-linecap: round; }
    .k-paw { fill: #121212; stroke: #62aaff; stroke-opacity: .6; stroke-width: 1.2; }
    .k-bobg { animation: bob 2.6s ease-in-out infinite; }
    .k-eyes { animation: look 6s ease-in-out infinite; }
    .k-tailg { transform-origin: 12px 90px; animation: tail 1.8s ease-in-out infinite; }
    .k-lensg { transform-origin: 84px 94px; animation: lens 2.4s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .packet { display: none; } }
  </style>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b2e"/><stop offset="1" stop-color="#0a1322"/></linearGradient>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <clipPath id="frame"><rect x="20" y="10" width="1560" height="280" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="20" y="10" width="1560" height="280" fill="url(#card)"/>
    <rect x="20" y="10" width="1560" height="280" fill="url(#grid)"/>
    <rect class="sweep" x="0" y="10" width="260" height="280" fill="url(#sh)"/>
  </g>
  <rect x="20.5" y="10.5" width="1559" height="279" rx="26" fill="none" stroke="#fff" stroke-opacity=".08"/>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">
