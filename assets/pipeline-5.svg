    <!-- track, nodes, labels -->
    <line x1="190.0" y1="220" x2="1410.0" y2="220" stroke="#18273f" stroke-width="8" stroke-linecap="round"/><line x1="190.0" y1="220" x2="1003.3" y2="220" stroke="#62aaff" stroke-width="4" stroke-linecap="round"/><line class="done-flow" x1="190.0" y1="220" x2="1003.3" y2="220" stroke="#cfe6ff" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/><line class="ahead" x1="1003.3" y1="220" x2="1410.0" y2="220" stroke="#6f86a8" stroke-width="3" stroke-linecap="round"/><g class="packet" style="--span:406.7px"><circle cx="1003.3" cy="220" r="11" fill="#62aaff" fill-opacity=".28"/><circle cx="1003.3" cy="220" r="4.5" fill="#cfe6ff"/></g>
    <circle cx="190.0" cy="220" r="14" fill="#62aaff" stroke="#62aaff" stroke-width="2.5"/><path d="M184.0 220 l4 4.5 l8 -9" fill="none" stroke="#101c2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(190.0 176)" fill="none" stroke="#cfe6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10 L2.8 -2.8 L10 0 L2.8 2.8 L0 10 L-2.8 2.8 L-10 0 L-2.8 -2.8 Z"/></g><circle cx="393.3" cy="220" r="14" fill="#62aaff" stroke="#62aaff" stroke-width="2.5"/><path d="M387.3 220 l4 4.5 l8 -9" fill="none" stroke="#101c2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(393.3 176)" fill="none" stroke="#cfe6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-4.5" r="4"/><path d="M-9 9 q0 -8.5 9 -8.5 q9 0 9 8.5"/></g><circle cx="596.7" cy="220" r="14" fill="#62aaff" stroke="#62aaff" stroke-width="2.5"/><path d="M590.7 220 l4 4.5 l8 -9" fill="none" stroke="#101c2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(596.7 176)" fill="none" stroke="#cfe6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle r="9"/><circle r="2.6" fill="#cfe6ff"/></g><circle cx="800.0" cy="220" r="14" fill="#62aaff" stroke="#62aaff" stroke-width="2.5"/><path d="M794.0 220 l4 4.5 l8 -9" fill="none" stroke="#101c2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(800.0 176)" fill="none" stroke="#cfe6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M-4 -6 l-6 6 l6 6 M4 -6 l6 6 l-6 6 M1.5 -8 l-3 16"/></g><circle class="halo" cx="1003.3" cy="220" r="30" fill="#FF7036" fill-opacity=".16"/><circle class="spin" cx="1003.3" cy="220" r="24" fill="none" stroke="#FF7036" stroke-width="2" stroke-dasharray="10 8"/><circle cx="1003.3" cy="220" r="17" fill="#1a0f08" stroke="#FF7036" stroke-width="3"/><circle class="core" cx="1003.3" cy="220" r="5" fill="#FF7036"/><circle cx="1206.7" cy="220" r="14" fill="#0a1322" stroke="#32486a" stroke-width="2.5"/><g transform="translate(1206.7 176)" fill="none" stroke="#61759a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10 L9 -6 V1 Q9 8 0 11 Q-9 8 -9 1 V-6 Z"/><path d="M-4 1 l3 3 l6 -7"/></g><circle cx="1410.0" cy="220" r="14" fill="#0a1322" stroke="#32486a" stroke-width="2.5"/><g transform="translate(1410.0 176)" fill="none" stroke="#61759a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle r="9"/><path d="M-4.5 0.5 l3.5 3.5 l6.5 -7.5"/></g>
    <text x="190.0" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#cfe6ff">New</text><text x="393.3" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#cfe6ff">Assigned</text><text x="596.7" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#cfe6ff">Open</text><text x="800.0" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#cfe6ff">Fixed</text><text x="1003.3" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#FF7036">Retest</text><text x="1206.7" y="270" text-anchor="middle" font-size="16" font-weight="500" fill="#61759a">Verified</text><text x="1410.0" y="270" text-anchor="middle" font-size="16" font-weight="500" fill="#61759a">Closed</text>
  </g>
  
