<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="Let's find what others miss. ayesha.online. Postman, Playwright, Jira, Manual Testing.">
  <style>
    .mono { font-family: 'SFMono-Regular','JetBrains Mono',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }

    @keyframes sweep { 0% { transform: translate(240px,236px); } 50% { transform: translate(1330px,246px); } 100% { transform: translate(240px,236px); } }
    @keyframes crawl { from { transform: translateX(-60px); } to { transform: translateX(1660px); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
    .a1 { animation: rise .8s ease-out .2s both; }
    .a2 { animation: rise .8s ease-out .5s both; }
    .a3 { animation: rise .8s ease-out .8s both; }
    .sweep { animation: sweep 10s ease-in-out infinite; }
    .crawl { animation: crawl 14s linear infinite; }
    .cursor { animation: blink 1s step-end infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs><clipPath id="frame"><rect width="1600" height="520" rx="36"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="520" fill="#0e1829"/>
    <rect x="28" y="28" width="1544" height="464" rx="26" fill="none" stroke="#2d4668" stroke-width="2" stroke-dasharray="10 12"/>
    <text class="mono a1" x="800" y="130" text-anchor="middle" font-size="20" fill="#FF7036" letter-spacing="6">LET'S CONNECT</text>
    <text class="sans a2" x="800" y="250" text-anchor="middle" font-size="86" font-weight="800" fill="#e6eefb" letter-spacing="-2.5">Let's find what others miss.</text>
    <text class="mono a3" x="800" y="324" text-anchor="middle" font-size="28" fill="#62aaff">$ ayesha.online<tspan class="cursor" fill="#FF7036"> ▍</tspan></text>
    <text class="mono a3" x="800" y="376" text-anchor="middle" font-size="22" fill="#8196b5">Web Testing · API Testing · Manual Testing · Automated Testing</text>
    <g class="sweep">
      <circle cx="0" cy="0" r="58" fill="#62aaff" fill-opacity=".09" stroke="#e6eefb" stroke-width="7"/>
      <path d="M-34 -32 q12 -18 32 -20" stroke="#fff" stroke-opacity=".55" stroke-width="5" fill="none" stroke-linecap="round"/>
      <line x1="41" y1="41" x2="92" y2="92" stroke="#e6eefb" stroke-width="11" stroke-linecap="round"/>
    </g>
    <g class="crawl"><g transform="translate(0,452)">
</g></g>
  </g>
</svg>