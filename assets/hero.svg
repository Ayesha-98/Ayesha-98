<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-label="Ayesha, software tester. A bug report ticket reads: visitor has not hired Ayesha yet." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <style>
    /* ============================================================
       1. PALETTE  (change a colour here and it updates everywhere)
       ============================================================ */
    :root {
      --bg:      #05070d;   /* page background (black) */
      --accent:  #62aaff;   /* main accent: role, dots, good text */
      --white:   #e8f0fa;   /* main text */
      --muted:   #8aa0bd;   /* labels, skills line */
      --line:    #2b4468;   /* borders and dividers */
      --yellow:  #ffc857;   /* HELLO, I'M and OPEN badge */
      --red:     #ff6b5b;   /* HIGH badge and "Actual" line */
      --card:    #101c2f;   /* ticket background */

      --glow-a:  #4d9bff;   /* glow, top right */
      --glow-b:  #2f6fe0;   /* glow, bottom left */
    }

    /* ============================================================
       2. FONTS
       ============================================================ */
    .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }

    /* ============================================================
       3. BACKGROUND GLOW
       ============================================================ */
    .bg      { fill: var(--bg); }
    .stop-a  { stop-color: var(--glow-a); }
    .stop-b  { stop-color: var(--glow-b); }

    /* ============================================================
       4. TOP BAR
       ============================================================ */
    .dot-fill     { fill: var(--accent); }
    .site-name    { font-size: 15px; fill: var(--accent); letter-spacing: 2px; }
    .pill-outline { fill: none; stroke: var(--line); stroke-width: 2; }
    .pill-text    { font-size: 17px; fill: var(--accent); letter-spacing: 2px; text-anchor: middle; }

    /* ============================================================
       5. INTRO (left side)
       ============================================================ */
    .hello  { font-size: 22px;  fill: var(--yellow); letter-spacing: 5px; }
    .name   { font-size: 170px; font-weight: 800; fill: var(--white); letter-spacing: -5px; }
    .role   { font-size: 44px;  font-weight: 700; fill: var(--accent); }
    .skills { font-size: 26px;  fill: var(--muted); }
    .tools  { font-size: 20px;  fill: var(--white); fill-opacity: .75; }

    /* magnifying glass that sweeps across the name */
    .mag-lens   { fill: var(--accent); fill-opacity: .10; stroke: var(--white); stroke-width: 7; }
    .mag-shine  { fill: none; stroke: #fff; stroke-opacity: .6; stroke-width: 5; stroke-linecap: round; }
    .mag-handle { stroke: var(--white); stroke-width: 11; stroke-linecap: round; }

    /* ============================================================
       6. BUG TICKET (right side)
       ============================================================ */
    .card      { fill: var(--card); stroke: var(--line); stroke-width: 2; }
    .ticket-id { font-size: 22px; font-weight: 700; fill: var(--white); }
    .divider   { stroke: var(--line); stroke-width: 2; }

    .badge-text    { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; text-anchor: middle; }
    .badge-high-bg { fill: var(--red);    fill-opacity: .18; }
    .badge-high    { fill: var(--red); }
    .badge-open-bg { fill: var(--yellow); fill-opacity: .18; }
    .badge-open    { fill: var(--yellow); }

    .ticket-body { font-size: 19px; }
    .key         { fill: var(--muted); }
    .value       { fill: var(--white); }
    .value-good  { fill: var(--accent); }
    .value-bad   { fill: var(--red); }
    .caret       { fill: var(--yellow); }

    .frame-border { fill: none; stroke: #fff; stroke-opacity: .08; stroke-width: 2; }

    /* ============================================================
       7. ANIMATIONS
       ============================================================ */
    @keyframes rise   { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes slide  { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
    @keyframes pulse  { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
    @keyframes blink  { 50% { opacity: 0; } }
    @keyframes sweep  { 0%, 100% { transform: translate(250px, 252px); } 50% { transform: translate(600px, 268px); } }
    @keyframes breathe { 0%, 100% { opacity: .8; } 50% { opacity: 1; } }

    /* things on the left fade up one after another */
    .rise-1 { animation: rise .8s ease-out .10s both; }
    .rise-2 { animation: rise .8s ease-out .35s both; }
    .rise-3 { animation: rise .8s ease-out .60s both; }
    .rise-4 { animation: rise .8s ease-out .85s both; }

    /* ticket lines slide in one by one */
    .line-1 { animation: slide .5s ease-out 1.1s both; }
    .line-2 { animation: slide .5s ease-out 1.6s both; }
    .line-3 { animation: slide .5s ease-out 2.1s both; }
    .line-4 { animation: slide .5s ease-out 2.6s both; }
    .line-5 { animation: slide .5s ease-out 3.1s both; }

    .dot    { animation: pulse 1.4s ease-in-out infinite; }
    .cursor { animation: blink 1s step-end infinite; }
    .sweep  { animation: sweep 9s ease-in-out infinite; }
    .glow-a { animation: breathe 7s ease-in-out infinite; }
    .glow-b { animation: breathe 9s ease-in-out 2s infinite; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <!-- glow gradients: make them bigger with r="", move them with cx / cy -->
    <radialGradient id="glowTopRight" cx="1380" cy="130" r="640" gradientUnits="userSpaceOnUse">
      <stop class="stop-a" offset="0"   stop-opacity=".30"/>
      <stop class="stop-a" offset=".45" stop-opacity=".10"/>
      <stop class="stop-a" offset="1"   stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="170" cy="610" r="700" gradientUnits="userSpaceOnUse">
      <stop class="stop-b" offset="0"   stop-opacity=".38"/>
      <stop class="stop-b" offset=".5"  stop-opacity=".12"/>
      <stop class="stop-b" offset="1"   stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1600" height="600" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- ===== BACKGROUND: black + glow ===== -->
    <rect class="bg" width="1600" height="600"/>
    <rect class="glow-a" width="1600" height="600" fill="url(#glowTopRight)"/>
    <rect class="glow-b" width="1600" height="600" fill="url(#glowBottomLeft)"/>

    <!-- ===== TOP BAR ===== -->
    <g class="rise-1"><circle class="dot dot-fill" cx="70" cy="64" r="5"/></g>
    <text class="mono site-name rise-1" x="88" y="69">ayesha.online</text>

    <g class="mono rise-1">
      <rect class="pill-outline" x="1226" y="44" width="310" height="38" rx="19"/>
      <circle class="dot dot-fill" cx="1256" cy="63" r="4.5"/>
      <text class="pill-text" x="1394" y="69">QA · OPEN FOR WORK</text>
    </g>

    <!-- ===== INTRO ===== -->
    <text class="mono hello rise-1" x="64" y="170">HELLO, I'M</text>
    <text class="sans name rise-2"  x="58" y="310">Ayesha</text>
    <text class="sans role rise-3"  x="64" y="378">Software Tester</text>
    <text class="sans skills rise-4" x="64" y="430">Web Testing · API Testing · Manual Testing · Automated Testing</text>
    <text class="mono tools rise-4"  x="64" y="478">Postman · Playwright · Jira</text>

    <!-- ===== MAGNIFYING GLASS ===== -->
    <g class="sweep">
      <circle class="mag-lens" cx="0" cy="0" r="52"/>
      <path   class="mag-shine" d="M-30 -30 q10 -16 28 -18"/>
      <line   class="mag-handle" x1="37" y1="37" x2="86" y2="86"/>
    </g>

    <!-- ===== BUG TICKET ===== -->
    <g transform="translate(900 120)">
      <rect class="card rise-2" width="636" height="396" rx="22"/>

      <!-- header: id + badges -->
      <text class="mono ticket-id rise-2" x="32" y="52">BUG-001</text>
      <g class="mono rise-2">
        <rect class="badge-high-bg" x="446" y="28" width="74" height="32" rx="16"/>
        <text class="badge-text badge-high" x="483" y="50">HIGH</text>
        <rect class="badge-open-bg" x="530" y="28" width="74" height="32" rx="16"/>
        <text class="badge-text badge-open" x="567" y="50">OPEN</text>
      </g>
      <line class="divider" x1="32" y1="80" x2="604" y2="80"/>

      <!-- ticket lines -->
      <g class="mono ticket-body">
        <g class="line-1">
          <text class="key"   x="32"  y="122">Summary</text>
          <text class="value" x="180" y="122">Verify visitor scrolled down or not</text>
        </g>
        <g class="line-2">
          <text class="key"   x="32"  y="168">Steps</text>
          <text class="value" x="180" y="168">1. Read this profile</text>
        </g>
        <g class="line-3">
          <text class="value" x="180" y="204">2. Scroll down. Watch the cat.</text>
        </g>
        <g class="line-4">
          <text class="key"        x="32"  y="254">Expected</text>
          <text class="value-good" x="180" y="254">Visitor scrolls down and sees</text>
          <text class="value-good" x="180" y="286">the bug life cycle</text>
        </g>
        <g class="line-5">
          <text class="key"       x="32"  y="338">Actual</text>
          <text class="value-bad" x="180" y="338">Still reading<tspan class="caret cursor"> ▍</tspan></text>
        </g>
      </g>
    </g>

    <!-- ===== FRAME BORDER ===== -->
    <rect class="frame-border" x="1" y="1" width="1598" height="598" rx="36"/>
  </g>
</svg>